<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Productos filtrados</title></head>
<body>
<h1>Productos de <span th:text="${categoria.nombre}"></span></h1>
<p>Precio mayor a: <strong th:text="${minimo}"></strong></p>
<p th:if="${#lists.isEmpty(productos)}">No hay productos que cumplan el filtro.</p>
<table border="1" th:unless="${#lists.isEmpty(productos)}">
    <thead>
    <tr><th>Nombre</th><th>Precio</th><th>Stock</th><th>Categoría</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${productos}">
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.precio}"></td>
        <td th:text="${p.stock}"></td>
        <td th:text="${p.categoria.nombre}"></td>
    </tr>
    </tbody>
</table>
<a th:href="@{/productos}">Volver a productos</a>
</body>
</html>
